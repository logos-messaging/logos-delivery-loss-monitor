name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/package.sh"
      - "client/Dockerfile"
      - "client/Makefile"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, with the leading v (nothing is published)"
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; else tag=${INPUT_VERSION:-v0.1.0}; fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version tag: $tag" >&2; exit 1 ;;
          esac
          version=${tag#v}
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a semantic version: $version" >&2; exit 1
          fi
          nimble=$(sed -n 's/^version = "\(.*\)"/\1/p' client/lossmon_client.nimble)
          conf=$(sed -n 's/^ *AppVersion\* = "\(.*\)"/\1/p' client/src/conf.nim)
          if [ "$nimble" != "$version" ] || [ "$conf" != "$version" ]; then
            echo "client version mismatch: tag $version, nimble $nimble, conf.nim $conf" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Server tests
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  server:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false
      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$RUNNER_TEMP/out/lossmon-server" ./cmd/lossmon-server
      - name: Version
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: test "$("$RUNNER_TEMP/out/lossmon-server" --version)" = "lossmon-server $VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lossmon_server-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/lossmon-server
          if-no-files-found: error
          retention-days: 7

  client-linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build static binary
        run: docker build --target static-export --output "type=local,dest=$RUNNER_TEMP/out" client
      - name: Check
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          bin=$RUNNER_TEMP/out/lossmon-client
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          test "$("$bin" --version | head -n 1)" = "lossmon-client $VERSION"
          "$bin" --help > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lossmon_client-linux-amd64
          path: ${{ runner.temp }}/out/lossmon-client
          if-no-files-found: error
          retention-days: 7

  client-macos:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }
          - { runner: macos-15-intel, arch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        working-directory: client
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: make lossmon-client LOG_LEVEL=NOTICE
      - name: Check
        working-directory: client
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          test "$(build/lossmon-client --version | head -n 1)" = "lossmon-client $VERSION"
          build/lossmon-client --help > /dev/null
          otool -L build/lossmon-client
          otool -l build/lossmon-client | grep -A3 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' | grep -E 'minos|version' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lossmon_client-darwin-${{ matrix.arch }}
          path: client/build/lossmon-client
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [verify, server, client-linux, client-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lossmon_*
          path: ${{ runner.temp }}/bins
      - name: Package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: .github/scripts/package.sh "$VERSION" "$RUNNER_TEMP/bins" "$RUNNER_TEMP/dist"
      - name: Contents
        run: |
          ls -l "$RUNNER_TEMP/dist"
          cat "$RUNNER_TEMP/dist/SHA256SUMS"
          for f in "$RUNNER_TEMP"/dist/*.tar.gz; do tar -tzvf "$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --draft --verify-tag --title "$TAG" \
            --notes "Release notes pending."
