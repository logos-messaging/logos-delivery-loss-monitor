name: client

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
      - ".github/actions/client-deps/**"
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
      - ".github/actions/client-deps/**"
  workflow_dispatch:
    inputs:
      server_url:
        description: "lossmon server URL for the live smoke run"
        required: true
      preset:
        description: "Network preset"
        required: true
        default: logos.test
      seconds:
        description: "Run length in seconds"
        required: true
        default: "120"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/client-deps
      - name: Unit tests
        run: make -C client test
      - name: Build
        run: make -C client lossmon-client
      - name: Help text
        run: client/build/lossmon-client --help

  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/client-deps
      - name: Build
        run: make -C client lossmon-client
      - name: Live smoke run
        env:
          SMOKE_TOKEN: ${{ secrets.LOSSMON_SMOKE_TOKEN }}
          SERVER_URL: ${{ inputs.server_url }}
          PRESET: ${{ inputs.preset }}
          SECONDS_TO_RUN: ${{ inputs.seconds }}
        run: |
          set -eu
          printf '%s' "$SMOKE_TOKEN" > "$RUNNER_TEMP/token"
          chmod 600 "$RUNNER_TEMP/token"
          mkdir "$RUNNER_TEMP/data"
          timeout --signal=TERM --preserve-status "$SECONDS_TO_RUN" client/build/lossmon-client \
            --server-url="$SERVER_URL" --token-file="$RUNNER_TEMP/token" --data-dir="$RUNNER_TEMP/data" --preset="$PRESET" \
            --location=eu --role=both --rate=0.2 --payload-bytes=256 || [ $? -eq 143 ]
