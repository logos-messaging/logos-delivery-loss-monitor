name: lossmon

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  server:
    <<: *hardened
    build:
      context: ../server
    image: lossmon-server:local
    read_only: true
    ports:
      - "127.0.0.1:${LOSSMON_SERVER_PORT:-8080}:8080"
    environment:
      LOSSMON_TOKENS_FILE: /run/secrets/lossmon_tokens
      LOSSMON_PROBE_KEY_FILE: /run/secrets/lossmon_probe_key
      LOSSMON_PRESET: ${LOSSMON_PRESET:-logos.dev}
      LOSSMON_CLUSTER_ID: ${LOSSMON_CLUSTER_ID:-}
      LOSSMON_ALLOW_PRESET: ${LOSSMON_ALLOW_PRESET:-}
      LOSSMON_TOPICS: ${LOSSMON_TOPICS:-/lossmon/1/probe-0/raw}
      LOSSMON_LOCATIONS: ${LOSSMON_LOCATIONS:-af,as,eu,na,oc,sa}
      LOSSMON_MAX_RATE_PER_CLIENT: ${LOSSMON_MAX_RATE_PER_CLIENT:-1.0}
      LOSSMON_MAX_RATE_TOTAL: ${LOSSMON_MAX_RATE_TOTAL:-20}
      LOSSMON_WINDOW: ${LOSSMON_WINDOW:-10m}
      LOSSMON_GRACE: ${LOSSMON_GRACE:-30s}
      LOSSMON_HOLD: ${LOSSMON_HOLD:-10m}
      LOSSMON_RECEIVER_WARMUP: ${LOSSMON_RECEIVER_WARMUP:-30s}
      LOSSMON_MAX_CLOCK_OFFSET: ${LOSSMON_MAX_CLOCK_OFFSET:-60s}
      LOSSMON_LOSS_RATIO_WINDOW: ${LOSSMON_LOSS_RATIO_WINDOW:-1h}
    secrets:
      - lossmon_tokens
      - lossmon_probe_key
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9102/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    read_only: true
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      server:
        condition: service_healthy

  grafana:
    <<: *hardened
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/lossmon.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  listener:
    <<: *hardened
    profiles: [listener]
    build:
      context: ../client
      args:
        LD_VERSION: ${LOSSMON_CLIENT_LD_VERSION:-unknown}
    image: lossmon-client:local
    platform: linux/amd64
    command: ["--data-dir=/data"]
    read_only: true
    environment:
      LOSSMON_SERVER_URL: http://server:8080
      LOSSMON_INSECURE_HTTP: "true"
      LOSSMON_TOKEN_FILE: /run/secrets/lossmon_listener_token
      LOSSMON_PRESET: ${LOSSMON_PRESET:-logos.dev}
      LOSSMON_ALLOW_PRESET: ${LOSSMON_ALLOW_PRESET:-}
      LOSSMON_LOCATION: ${LOSSMON_LISTENER_LOCATION:-eu}
      LOSSMON_MODE: core
      LOSSMON_ROLE: receive
    secrets:
      - lossmon_listener_token
    volumes:
      - listener-data:/data
    depends_on:
      server:
        condition: service_healthy

  caddy:
    <<: *hardened
    profiles: [public]
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    ports:
      - "${LOSSMON_HTTP_PORT:-80}:80"
      - "${LOSSMON_HTTPS_PORT:-443}:443"
    environment:
      LOSSMON_PUBLIC_HOST: ${LOSSMON_PUBLIC_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

secrets:
  lossmon_tokens:
    file: ./secrets/tokens
  lossmon_probe_key:
    file: ./secrets/probe_key
  lossmon_listener_token:
    file: ./secrets/listener_token

volumes:
  prometheus-data:
  grafana-data:
  listener-data:
  caddy-data:
  caddy-config:
